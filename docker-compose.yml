# ── ZypherCenter — Deployment Compose ────────────────────────────────────────
# Pre-built image from your local registry: codevault.sh
# 
# Quick start:
#   1. Copy this file and create a .env file on your server
#   2. Edit .env (set PROXMOX_HOST + SESSION_SECRET)
#   3. docker compose pull
#   4. docker compose up -d
#
# Or without compose (single docker run):
#   docker run -d -p 80:80 \
#     -e PROXMOX_HOST=https://YOUR_PROXMOX_IP:8006 \
#     -e SESSION_SECRET=$(openssl rand -hex 32) \
#     --name zyphercenter --restart unless-stopped \
#     codevault.sh/zypher-systems/zyphercenter:v0.7.0
# ─────────────────────────────────────────────────────────────────────────────

services:
  zyphercenter:
    # Updated to point to your self-hosted registry
    image: codevault.sh/zypher-systems/zyphercenter:${IMAGE_TAG:-v0.7.0}
    container_name: zyphercenter
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      # ── Proxmox connection ─────────────────────────────────────────────────
      # Full URL to your Proxmox host. 
      # Since you're on a private mesh, use the internal IP (e.g., 10.0.0.1)
      PROXMOX_HOST: ${PROXMOX_HOST:-}

      # Most local Proxmox setups use self-signed certs; keep this as false.
      PROXMOX_TLS_VERIFY: ${PROXMOX_TLS_VERIFY:-false}

      # ── Session security ───────────────────────────────────────────────────
      # Required for stable logins. Generate with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:-}

      # ── Cookie security ────────────────────────────────────────────────────
      # Set to "true" only if you've configured Zoraxy or Nginx for HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      LOG_LEVEL: ${LOG_LEVEL:-info}

    restart: unless-stopped
